server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for faster loads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Single-Page-App routing: if a file isn't found on disk, serve index.html
    # so react-router can handle the URL on the client side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (they have hashed filenames from Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Proxy API calls to the backend container so the browser sees ONE origin ──
    # "backend" = the service name in docker-compose.yml; 8000 = its internal port.
    # If your backend runs on a different port, change 8000 here AND the `expose`
    # value in docker-compose.yml to match.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
